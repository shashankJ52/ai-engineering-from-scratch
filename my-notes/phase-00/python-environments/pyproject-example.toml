[project]
name = "ai-llm-practice-project"
version = "0.1.0"
description = "Practice project for learning Python environments in AI engineering"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
]

llm = [
    "anthropic>=0.39",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
